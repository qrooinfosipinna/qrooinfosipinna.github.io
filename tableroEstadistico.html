<!DOCTYPE html>
<html lang="es-Es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIESESIPINNA</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Preconnect a fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tableroestadisticos.css" />
</head>

<body>
  <div id="header"></div>

  <main>

    <section class="dependencias-section">
      <div class="dependencias-header">
        <span>Tableros estadísticos</span>
        <h2>Selecciona una dependencia</h2>
        <p>Consulta la información estadística reportada por cada institución.</p>
      </div>

      <div class="dependencias-grid">

        <a href="tableroSipinnas.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logos/sipinnas.png" alt="SIPINNAS Municipales" loading="lazy" decoding="async">
          </div>
          <h3>SIPINNAS Municipales</h3>
        </a>

        <a href="tablerosesa.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logos/sesa.png" alt="SESA" loading="lazy" decoding="async">
          </div>
          <h3>SESA</h3>
        </a>

        <a href="tablerofiscalia.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logos/fiscalia.png" alt="Fiscalía" loading="lazy" decoding="async">
          </div>
          <h3>Fiscalía</h3>
        </a>

        <a href="tableroregistrocivil.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logos/registro-civil.png" alt="Registro Civil" loading="lazy" decoding="async">
          </div>
          <h3>Registro Civil</h3>
        </a>

        <a href="tableroppnnayf.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logos/ppnnayf.png" alt="PPNNAyF" loading="lazy" decoding="async">
          </div>
          <h3>PPNNAyF</h3>
        </a>

        <a href="tablerodif.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logos/dif.png" alt="DIF" loading="lazy" decoding="async">
          </div>
          <h3>DIF</h3>
        </a>

      </div>
    </section>

  </main>

  <div id="footer"></div>

  <script src="js/layout.js" defer></script>
</body>

</html>
