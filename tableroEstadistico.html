<!DOCTYPE html>
<html lang="es-Es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIESESIPINNA</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Preconnect a fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tableroestadisticos.css" />
</head>

<body>
  <div id="header"></div>

  <main>

    <section class="dependencias-section">
      <div class="dependencias-header">
        <span>Tableros estadísticos</span>
        <h2>Selecciona un tablero</h2>
        <p>Consulta información oficial de Quintana Roo con fuente y periodo verificables.</p>
      </div>

      <div class="dependencias-grid">

        <a href="tableroSesipinna.html" class="dependencia-card">
          <div class="logo-box">
            <img src="images/logo.png" alt="SESIPINNA estatal" loading="lazy" decoding="async">
          </div>
          <h3>SESIPINNA estatal</h3>
        </a>

        <a href="tableroDelitos.html" class="dependencia-card">
          <div class="logo-box">
            <span class="fuente-siglas" aria-hidden="true">SESNSP</span>
          </div>
          <h3>Víctimas de delitos NNA</h3>
        </a>

        <a href="tableroNacimientos.html" class="dependencia-card">
          <div class="logo-box">
            <span class="fuente-siglas fuente-inegi" aria-hidden="true">INEGI</span>
          </div>
          <h3>Nacimientos registrados</h3>
        </a>

      </div>
    </section>

  </main>

  <div id="footer"></div>

  <script src="js/layout.js" defer></script>
