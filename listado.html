<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listado de Indicadores</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Preconnect a fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/listado.css" />
</head>

<body>

  <div id="header"></div>

  <!-- CONTENIDO -->
  <h1 id="tituloTema" class="text-center flex-grow-1">Listado de Indicadores</h1>
  <main class="container my-5">
    <div id="descripcionTema" class="mb-4 text-center text-secondary"></div>

    <div class="row" id="contenedorIndicadores">
      <!-- Tarjetas generadas dinámicamente -->
    </div>
  </main>

  <!-- FOOTER -->
  <div id="footer"></div>

  <script src="js/layout.js" defer></script>
  <script src="js/indicadores-config.js" defer></script>
  <script>
    let catalogoCache = null;

    async function cargarCatalogo() {
      if (catalogoCache) return catalogoCache;
      const res = await fetch(CONFIG_DATOS);
      if (!res.ok) throw new Error("No se pudo cargar el catálogo");
      catalogoCache = await res.json();
      return catalogoCache;
    }

    async function inicializar() {
      const params = new URLSearchParams(window.location.search);
      const tema = params.get("tema");
      const titulo = document.getElementById("tituloTema");
      const descripcion = document.getElementById("descripcionTema");
      const contenedor = document.getElementById("contenedorIndicadores");

      if (!tema) {
        titulo.textContent = "Listado de Indicadores";
        descripcion.textContent = "Selecciona un tema desde la página principal.";
        contenedor.innerHTML = "";
        return;
      }

      const config = TEMAS_CONFIG[tema];
      if (!config) {
        titulo.textContent = "Tema no encontrado";
        descripcion.textContent = "El tema solicitado no existe.";
        contenedor.innerHTML = '<div class="alert alert-warning text-center mt-4">Tema no reconocido.</div>';
        return;
      }

      titulo.textContent = config.titulo || "Indicadores de " + config.nombre;
      descripcion.textContent = config.descripcion || "";

      if (config.sinDatos) {
        contenedor.innerHTML = `
          <div class="placeholder-container text-center py-5 col-12">
            <div class="placeholder-icon mb-3" style="font-size: 5rem; opacity: 0.3;">🔧</div>
            <h3 class="text-muted mb-3">En construcción / Actualización</h3>
            <p class="text-secondary">
              Los indicadores para el tema <strong>${config.nombre}</strong> aún no están disponibles.
            </p>
            <p class="text-muted">
              Estamos trabajando en la integración de los datos. Vuelve pronto para consultar la información completa.
            </p>
            <a href="index.html" class="btn btn-institucional mt-3">Volver al inicio</a>
          </div>
        `;
        return;
      }

      try {
        const catalogo = await cargarCatalogo();
        const indicadoresDelTema = catalogo.indicadores.filter(ind => ind.tema === tema);

        if (indicadoresDelTema.length === 0) {
          contenedor.innerHTML = '<div class="alert alert-info text-center mt-4">No hay indicadores disponibles para este tema.</div>';
          return;
        }

        contenedor.innerHTML = "";
        indicadoresDelTema.forEach(ind => {
          const card = document.createElement("div");
          card.className = "col-md-6 col-lg-4 mb-4";
          
          const hasData = ind.rows > 0;
          const badgeClass = hasData ? "badge-bg-ready" : "badge-bg-pending";
          const badgeText = hasData ? "Datos disponibles" : "En proceso";
          
          card.innerHTML = `
            <div class="card shadow-sm h-100 indicator-card-${tema}">
              <div class="card-body">
                <span class="badge ${badgeClass} mb-2">${badgeText}</span>
                <h5 class="card-title">${ind.nombre}</h5>
                <p class="card-text text-truncate">${ind.fuente || "Fuente: INEGI"}</p>
                <a href="indicador.html?tema=${tema}&indicador=${ind.id}" class="btn btn-institucional w-100">Ver indicador</a>
              </div>
            </div>
          `;
          contenedor.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        contenedor.innerHTML = '<div class="alert alert-danger text-center mt-4">Error al cargar los indicadores. Inténtalo de nuevo.</div>';
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", inicializar);
    } else {
      inicializar();
    }
  </script>
</body>

</html>
