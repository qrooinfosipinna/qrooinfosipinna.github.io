<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indicadores INEGI | InfoSESIPINNA QROO</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/listado.css" />
</head>

<body>

  <div id="header"></div>

  <main>
    <!-- =========================================================
         MODO 1: MENÚ PRINCIPAL DE INDICADORES
         Se muestra cuando listado.html NO recibe ?tema=
         ========================================================= -->
    <section id="menuTemas" class="dependencias-section listado-menu-section">
      <div class="dependencias-header listado-header">
        <span>Indicadores INEGI</span>
        <h1>Selecciona un tema</h1>
        <p>Consulta los indicadores relacionados con niñas, niños y adolescentes de Quintana Roo.</p>
      </div>

      <div id="contenedorTemas" class="dependencias-grid listado-temas-grid">
        <!-- Generado dinámicamente desde TEMAS_CONFIG -->
      </div>
    </section>

    <!-- =========================================================
         CONTENEDOR RESERVADO
         La selección de indicadores se realiza en indicador.html.
         listado.html funciona únicamente como menú de apartados.
         ========================================================= -->
    <section id="listaIndicadores" class="indicadores-lista-section d-none">
      <div class="container py-5">

        <a href="listado.html" class="listado-back">
          <span aria-hidden="true">←</span> Volver a temas
        </a>

        <div class="dependencias-header listado-header listado-header-tema">
          <span id="etiquetaTema">Indicadores</span>
          <h1 id="tituloTema">Indicadores</h1>
          <p id="descripcionTema"></p>
        </div>

        <div id="contenedorIndicadores" class="indicadores-grid-premium">
          <!-- Generado dinámicamente -->
        </div>

      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="js/layout.js" defer></script>
  <script src="js/indicadores-config.js" defer></script>

  <script>
    let catalogoCache = null;

    document.addEventListener("DOMContentLoaded", () => {
      inicializarListado();
    });

    async function inicializarListado() {
      const params = new URLSearchParams(window.location.search);
      const tema = normalizarTema(params.get("tema"));

      /* listado.html funciona como menú de apartados.
         Si llega un tema por URL:
         - Temas sin datos → placeholder.html
         - Temas con datos → indicador.html */
      if (tema) {
        const config = TEMAS_CONFIG[tema];

        if (config && config.sinDatos) {
          window.location.replace(
            `placeholder.html?tema=${encodeURIComponent(tema)}`
          );
          return;
        }

        window.location.replace(
          `indicador.html?tema=${encodeURIComponent(tema)}`
        );
        return;
      }

      mostrarMenuTemas();
    }

    function normalizarTema(valor) {
      if (!valor) return null;

      const texto = String(valor).trim().toLowerCase();
      const equivalencias = {
        "al25": "al25",
        "25al25": "al25",
        "25 al 25": "al25",
        "participacion": "participacion",
        "participación": "participacion",
        "proteccion": "proteccion",
        "protección": "proteccion",
        "demografico": "demografico",
        "demográfico": "demografico",
        "desarrollo": "desarrollo",
        "supervivencia": "supervivencia"
      };

      return equivalencias[texto] || texto;
    }

    /* =========================================================
       MENÚ DE TEMAS
       ========================================================= */
    function mostrarMenuTemas() {
      document.getElementById("menuTemas").classList.remove("d-none");
      document.getElementById("listaIndicadores").classList.add("d-none");

      const contenedor = document.getElementById("contenedorTemas");
      contenedor.innerHTML = "";

      Object.entries(TEMAS_CONFIG).forEach(([clave, tema]) => {
        const enlace = document.createElement("a");

        /* Temas sin datos → placeholder.html; temas con datos → indicador.html */
        if (tema.sinDatos) {
          enlace.href = `placeholder.html?tema=${encodeURIComponent(clave)}`;
        } else {
          enlace.href = `indicador.html?tema=${encodeURIComponent(clave)}`;
        }

        enlace.className = `dependencia-card tema-card tema-${clave}`;
        enlace.setAttribute("aria-label", `Consultar indicadores de ${tema.nombre}`);

        let badgeHtml = "";
        if (tema.sinDatos) {
          badgeHtml = `<span class="tema-badge-pending">En proceso</span>`;
        }

        enlace.innerHTML = `
          <div class="logo-box tema-logo-box">
            <img
              src="${tema.imagen}"
              alt="${escapeHtml(tema.nombre)}"
              loading="lazy"
              decoding="async"
            >
          </div>
          ${badgeHtml}
          <h3>${escapeHtml(tema.nombre)}</h3>
          <span class="tema-card-action">Ver indicadores <span aria-hidden="true">→</span></span>
        `;

        contenedor.appendChild(enlace);
      });
    }

    /* =========================================================
       LISTADO DE INDICADORES
       ========================================================= */
    async function mostrarIndicadoresDelTema(tema) {
      document.getElementById("menuTemas").classList.add("d-none");
      document.getElementById("listaIndicadores").classList.remove("d-none");

      const config = TEMAS_CONFIG[tema];
      const contenedor = document.getElementById("contenedorIndicadores");

      if (!config) {
        document.getElementById("tituloTema").textContent = "Tema no encontrado";
        document.getElementById("descripcionTema").textContent = "El apartado solicitado no existe.";
        contenedor.innerHTML = `
          <div class="listado-empty">
            <div class="listado-empty-icon">!</div>
            <h3>Tema no reconocido</h3>
            <p>Regresa al menú para seleccionar un apartado disponible.</p>
            <a href="listado.html" class="listado-primary-btn">Volver a temas</a>
          </div>
        `;
        return;
      }

      aplicarTema(config);

      if (config.sinDatos) {
        mostrarSinDatos(config);
        return;
      }

      contenedor.innerHTML = `
        <div class="listado-loading">
          <div class="spinner-border" role="status" aria-hidden="true"></div>
          <span>Cargando indicadores...</span>
        </div>
      `;

      try {
        const catalogo = await cargarCatalogo();
        const indicadores = catalogo.indicadores
          .filter(ind => normalizarTema(ind.tema) === tema)
          .sort((a, b) => compararClaves(a.clave, b.clave));

        if (!indicadores.length) {
          contenedor.innerHTML = `
            <div class="listado-empty">
              <div class="listado-empty-icon">i</div>
              <h3>No hay indicadores disponibles</h3>
              <p>Este apartado todavía no cuenta con indicadores registrados en el catálogo.</p>
            </div>
          `;
          return;
        }

        renderizarIndicadores(indicadores, tema, config);
      } catch (error) {
        console.error("Error al cargar catálogo:", error);
        contenedor.innerHTML = `
          <div class="listado-empty error">
            <div class="listado-empty-icon">!</div>
            <h3>No se pudo cargar el catálogo</h3>
            <p>Verifica que <code>datos-indicadores/catalogo.json</code> esté disponible.</p>
            <button type="button" class="listado-primary-btn" onclick="mostrarIndicadoresDelTema('${escapeJs(tema)}')">
              Intentar nuevamente
            </button>
          </div>
        `;
      }
    }

    function aplicarTema(config) {
      const color = config.colorPrincipal || "#154f39";
      document.documentElement.style.setProperty("--listado-color", color);
      document.documentElement.style.setProperty(
        "--listado-color-secundario",
        config.colorSecundario || color
      );

      document.getElementById("etiquetaTema").textContent = "Indicadores INEGI";
      document.getElementById("tituloTema").textContent = config.titulo || `Indicadores de ${config.nombre}`;
      document.getElementById("descripcionTema").textContent = config.descripcion || "";
    }

    function renderizarIndicadores(indicadores, tema, config) {
      const contenedor = document.getElementById("contenedorIndicadores");
      contenedor.innerHTML = "";

      indicadores.forEach(ind => {
        const enlace = document.createElement("a");
        enlace.href = `indicador.html?tema=${encodeURIComponent(tema)}&indicador=${encodeURIComponent(ind.id)}`;
        enlace.className = `indicador-menu-card indicador-${tema}`;

        const tieneDatos = Number(ind.rows || 0) > 0;

        enlace.innerHTML = `
          <div class="indicador-card-top">
            <span class="indicador-clave">${escapeHtml(ind.clave || "Indicador")}</span>
            <span class="indicador-status ${tieneDatos ? "ready" : "pending"}">
              ${tieneDatos ? "Disponible" : "En proceso"}
            </span>
          </div>

          <div class="indicador-card-icon" aria-hidden="true">
            <span>${escapeHtml(ind.clave || "I")}</span>
          </div>

          <div class="indicador-card-content">
            <h2>${escapeHtml(ind.nombre || "Indicador sin nombre")}</h2>
            <p>${escapeHtml(ind.fuente || "Fuente: INEGI")}</p>
          </div>

          <div class="indicador-card-footer">
            <span>Consultar indicador</span>
            <span class="indicador-arrow" aria-hidden="true">→</span>
          </div>
        `;

        contenedor.appendChild(enlace);
      });
    }

    function mostrarSinDatos(config) {
      document.getElementById("contenedorIndicadores").innerHTML = `
        <div class="listado-empty">
          <div class="listado-empty-icon">⌛</div>
          <h3>En construcción / actualización</h3>
          <p>Los indicadores para <strong>${escapeHtml(config.nombre)}</strong> aún no están disponibles.</p>
          <a href="listado.html" class="listado-primary-btn">Volver a temas</a>
        </div>
      `;
    }

    async function cargarCatalogo() {
      if (catalogoCache) return catalogoCache;

      const respuesta = await fetch(CONFIG_DATOS, { cache: "no-cache" });
      if (!respuesta.ok) {
        throw new Error(`HTTP ${respuesta.status}`);
      }

      catalogoCache = await respuesta.json();
      return catalogoCache;
    }

    function compararClaves(a, b) {
      const partesA = String(a || "").match(/\d+(?:\.\d+)?/);
      const partesB = String(b || "").match(/\d+(?:\.\d+)?/);

      if (!partesA || !partesB) return String(a).localeCompare(String(b), "es");
      return Number(partesA[0]) - Number(partesB[0]);
    }

    function escapeHtml(valor) {
      return String(valor ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeJs(valor) {
      return String(valor ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }
  </script>

</body>
</html>
