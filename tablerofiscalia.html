<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tablero Fiscalía | SIESESIPINNA</title>
  <link rel="icon" href="images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <!-- Preconnect a fuentes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/tablero-fiscalia.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>

<body>

  <div id="header"></div>

  <main class="tablero-fiscalia">

    <section class="tablero-hero-fiscalia">
      <span class="etiqueta-fiscalia">Fiscalía General del Estado de Quintana Roo</span>

      <p class="descripcion-fiscalia">
        Tablero estadístico mensual de delitos y casos solicitados, clasificados por municipio,
        sexo y rango de edad.
      </p>
    </section>

    <section class="filtros-tablero-fiscalia">
      <div>
        <label for="filtroMes">Mes reportado</label>
        <select id="filtroMes">
          <option value="todos">Todos los meses</option>
        </select>
      </div>

      <div>
        <label for="filtroMunicipio">Municipio</label>
        <select id="filtroMunicipio">
          <option value="todos">Todos los municipios</option>
        </select>
      </div>
    </section>

    <section class="resumen-cards-fiscalia">
      <article class="card-indicador-fiscalia">
        <span>Total de casos</span>
        <strong id="totalCasos">0</strong>
      </article>

      <article class="card-indicador-fiscalia">
        <span>Mujeres</span>
        <strong id="totalMujeres">0</strong>
      </article>

      <article class="card-indicador-fiscalia">
        <span>Hombres</span>
        <strong id="totalHombres">0</strong>
      </article>

      <article class="card-indicador-fiscalia">
        <span>Delitos reportados</span>
        <strong id="totalDelitos">0</strong>
      </article>
    </section>

    <section class="selector-estadistica-fiscalia">
      <div>
        <label for="selectorGrafica">Selecciona la estadística a visualizar</label>
        <select id="selectorGrafica">
          <option value="municipio">Casos por municipio</option>
          <option value="delito">Casos por tipo de delito</option>
          <option value="sexo">Distribución por sexo</option>
          <option value="edad">Distribución por rango de edad</option>
          <option value="comparativo">Comparativo por municipio y sexo</option>
        </select>
      </div>
    </section>

    <section class="panel-grafica-fiscalia grafica-activa-fiscalia">
      <h2 id="tituloGrafica">Casos por municipio</h2>
      <canvas id="graficaPrincipal"></canvas>
    </section>

    <section class="panel-tabla-fiscalia">
      <h2>Detalle de delitos y casos reportados</h2>

      <div class="tabla-responsive">
        <table class="tabla-fiscalia-matriz">
            <thead id="encabezadoTablaFiscalia"></thead>
            <tbody id="tablaReportes"></tbody>
        </table>
      </div>
    </section>

  </main>

<div id="footer"></div>
<script src="js/tablero-base.js" defer></script>
<script src="js/tablero-fiscalia.js" defer></script>
<script src="js/layout.js" defer></script>
</body>
</html>
